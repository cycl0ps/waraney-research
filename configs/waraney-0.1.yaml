project:
  name: WARANEY
  version: "0.1"

model:
  backbone: distilbert-base-uncased
  num_labels: 2

dataset:
  source: data/dataset-waraney-1.0.csv
  split_if_needed: true
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  random_state: 42
  stratify_by: label

  #stratify_by:
  #- label
  #- lang
  #stratify_by: null

training:
  epochs: 3
  batch_size: 16
  learning_rate: 2e-5
  max_length: 512

output:
  root_dir: outputs
